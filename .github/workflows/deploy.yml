name: Deploy to Cloudflare Pages

# Builds the Astro site and deploys it to the existing Cloudflare Pages project "arklens".
# - Push to main   → production deployment (arklens.pages.dev, and custom domains once attached)
# - Other branches → preview deployment (<branch>.arklens.pages.dev)
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   API token with "Account → Cloudflare Pages → Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare account ID
# Optional repository secret:
#   INDEXNOW_KEY           IndexNow key (8–128 chars [A-Za-z0-9-]): enables IndexNow for production (main) only.
#                          The key file is written into dist only for main, and new/materially changed
#                          www.arklens.ch URLs are submitted after a successful production deploy.
#                          IndexNow steps never fail the deployment. Manual "Run workflow" on main with
#                          indexnow_all ticked submits all sitemap URLs once.

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      indexnow_all:
        description: 'Production (main) only: submit ALL sitemap URLs to IndexNow after the deploy (one-time initial submit)'
        type: boolean
        default: false

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Check localisation (FR/DE/IT)
        run: npm run check:i18n

      - name: IndexNow key file (production only)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 2
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node scripts/indexnow.mjs write-key --dist dist

      - name: IndexNow snapshot of live production (production only)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 5
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node scripts/indexnow.mjs snapshot --dist dist --out "$RUNNER_TEMP/indexnow-before.json"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.141.0'
          command: pages deploy dist --project-name=arklens --branch=${{ github.ref_name }} --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: IndexNow notify new/changed URLs (production only)
        if: success() && github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 5
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          INDEXNOW_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.indexnow_all && 'true' || 'false' }}
        run: node scripts/indexnow.mjs notify --dist dist --before "$RUNNER_TEMP/indexnow-before.json"
